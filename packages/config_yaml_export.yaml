# =============================================================================
#  config_yaml_export.yaml
#  Drop into /config/packages/ — picked up by `packages: !include_dir_named packages`
#
#  Backend for the "Configuration Export" dashboard card. Schedules and reports
#  on ha_config_backup.py, which lives in the Samba share at
#  /share/ha_config_backup/ so Home Assistant updates cannot touch it.
#
#  Entities created:
#    input_datetime.config_export_time      run time, settable from the card
#    input_boolean.export_show_schedule     fold state, Schedule section
#    input_boolean.export_show_privacy      fold state, Privacy section
#    input_boolean.export_redact            redact credential-shaped values
#    input_boolean.export_sidecar           keep the reversal file for redaction
#    input_boolean.export_encrypt           encrypt the archive
#    input_boolean.export_encrypt_sidecar   encrypt the sidecar too
#    input_boolean.export_show_passphrase   unmask the passphrase box
#    input_text.export_passphrase           masked entry
#    input_text.export_passphrase_plain     visible entry
#    script.config_export_save_passphrase   writes it to a file, clears the boxes
#    script.config_export_clear_passphrase  deletes that file
#    script.config_export_run_now           the "Back up now" button
#    automation.config_export_daily         the schedule
#    sensor.config_export_status            status + per-tier inventory
#    sensor.config_export_passphrase        whether a passphrase exists, never its value
#
#  PASSPHRASE HANDLING
#  The passphrase is written to /share/ha_config_backup/.passphrase and both
#  text boxes are cleared immediately. It is never left in an entity: entity
#  state is written to .storage and the recorder database, both of which this
#  export copies, and a key stored inside the backup it protects is not a key.
#  The recorder block below keeps it out of the database on the way through.
#
#  Encryption and redaction are both OFF unless ticked on the card. See
#  docs/PRIVACY.md — encryption is a real boundary, redaction is best-effort.
#
# -----------------------------------------------------------------------------
#  MAKING THE CARD'S FOLDER BUTTONS CLICKABLE (Edge / Chrome, Windows)
# -----------------------------------------------------------------------------
#  The Daily / Weekly / Monthly / Yearly buttons on the card point at
#  file://homeassistant/share/ha_config_backup/<tier>/. Browsers block file://
#  links opened from an http(s) page, so out of the box those buttons do
#  nothing. One registry policy re-enables them.
#
#  Run an ELEVATED Command Prompt and paste the line for your browser:
#
#    Edge:
#      reg add "HKLM\SOFTWARE\Policies\Microsoft\Edge\URLAllowlist" /v 1 /t REG_SZ /d "file:///" /f
#
#    Chrome:
#      reg add "HKLM\SOFTWARE\Policies\Google\Chrome\URLAllowlist" /v 1 /t REG_SZ /d "file:///" /f
#
#  Fully close and reopen the browser, then confirm at edge://policy or
#  chrome://policy. To undo, swap "add" for "delete" and drop /t and /d.
#
#  Notes:
#    - This whitelists ALL file:// links, not just these.
#    - Desktop browsers only; the companion app cannot open file:// at all.
#    - Prefer a drive letter? Map the share to Z: and use file:///Z:/daily/.
#    - Not comfortable with it? The card prints the UNC path as selectable
#      text — paste that into Explorer instead.
# =============================================================================

# The passphrase entity must never reach the recorder database — see the
# comment on config_export_set_passphrase below.
recorder:
  exclude:
    entities:
      - input_text.export_passphrase
      - input_text.export_passphrase_plain

shell_command:
  config_yaml_export: >-
    python3 /share/ha_config_backup/ha_config_backup.py
    {% if is_state('input_boolean.export_redact', 'on') %}--redact{% endif %}
    {% if is_state('input_boolean.export_sidecar', 'off') %}--no-sidecar{% endif %}
    {% if is_state('input_boolean.export_encrypt', 'on') %}--encrypt{% endif %}
    {% if is_state('input_boolean.export_encrypt_sidecar', 'on') %}--encrypt-sidecar{% endif %}

  # Writes the passphrase to a file the export reads, then the script below
  # clears the text box. The passphrase is never left in an entity: entity
  # state lands in .storage and the recorder database, both of which this
  # very export copies — a key stored inside the backup is not a key.
  config_export_set_passphrase: >-
    sh -c 'umask 077; printf "%s" "{{ phrase }}" > /share/ha_config_backup/.passphrase'

  # Cleanup: reports what is eligible, and clears it on request. "Eligible"
  # means both older than a year and outside the twelve most recent — the
  # scripts prune on the same rule automatically, so this is a way to clear
  # earlier, not the only way it happens.
  config_export_cleanup: "python3 /share/ha_config_backup/ha_config_backup.py --cleanup"

  config_export_clear_passphrase: >-
    sh -c 'rm -f /share/ha_config_backup/.passphrase'

  # Diagnostics. Run from Developer Tools > Actions and read the response:
  # it reports the resolved config directory, write access and file counts.
  config_yaml_export_check: "python3 /share/ha_config_backup/ha_config_backup.py --check"

input_text:
  # Two boxes rather than one: a helper's mode is fixed when it is defined, so
  # a single field cannot be masked and unmasked at runtime. The card shows
  # whichever one matches the "Show passphrase" toggle.
  export_passphrase:
    name: Backup passphrase
    icon: mdi:key-variant
    mode: password
    max: 128
  export_passphrase_plain:
    name: Backup passphrase (visible)
    icon: mdi:key-variant
    mode: text
    max: 128

input_boolean:
  export_redact:
    # Best-effort removal of credential-shaped values before archiving. Makes
    # an export shareable; it is not a security boundary — see the docs.
    name: Redact personal info
    icon: mdi:eraser
  export_sidecar:
    # Records what redaction removed, OUTSIDE the archive, so a redacted
    # backup can still be restored in full. On by default.
    name: Keep sidecar of redacted values
    icon: mdi:file-key-outline
  export_encrypt:
    name: Encrypt the backup
    icon: mdi:lock
  export_encrypt_sidecar:
    name: Encrypt the sidecar
    icon: mdi:file-lock
  export_show_passphrase:
    name: Show passphrase while typing
    icon: mdi:eye-outline
  export_show_cleanup:
    name: Show cleanup section
    icon: mdi:broom
  export_show_privacy:
    name: Show privacy options
    icon: mdi:shield-lock-outline
  export_show_schedule:
    # Drives the "Schedule" fold on the dashboard card, for both tabs. Purely
    # UI state, so one helper on this server covers both.
    name: Show export schedule
    icon: mdi:calendar-clock

input_datetime:
  config_export_time:
    name: Config export time
    icon: mdi:clock-outline
    has_date: false
    has_time: true

command_line:
  # Reports only whether a passphrase exists and when it was last written —
  # never the value itself. Reading the passphrase into an entity would put it
  # in .storage and the recorder database, which is the thing this whole design
  # avoids.
  - sensor:
      name: "Config Export Passphrase"
      unique_id: config_export_passphrase_state
      command: >-
        python3 -c "import json,os,datetime as d;p='/share/ha_config_backup/.passphrase';e=os.path.isfile(p) and os.path.getsize(p)>0;print(json.dumps({'set':e,'changed':d.datetime.fromtimestamp(os.path.getmtime(p)).isoformat(timespec='seconds') if e else None}))"
      value_template: "{{ '••••••••' if value_json.set else 'Not set' }}"
      json_attributes:
        - set
        - changed
      scan_interval: 900

  - sensor:
      name: "Config Export Cleanup"
      unique_id: config_export_cleanup_state
      command: "python3 /share/ha_config_backup/ha_config_backup.py --cleanup-report"
      value_template: "{{ value_json.eligible | int(0) }}"
      unit_of_measurement: "items"
      json_attributes:
        - eligible
        - eligible_mb
        - auto_eligible
        - oldest_kept
        - rollbacks_total
        - rollbacks_eligible
        - rollbacks_mb
        - sidecars_total
        - sidecars_eligible
        - sidecars_mb
        - keep_recent
        - keep_days
        - items
        - generated
      scan_interval: 3600
      command_timeout: 60

  - sensor:
      name: "Config Export Status"
      unique_id: config_yaml_export_status
      command: "python3 /share/ha_config_backup/ha_config_backup.py --report"
      value_template: "{{ value_json.status }}"
      json_attributes:
        - root
        - generated
        - daily
        - weekly
        - monthly
        - yearly
        - total_mb
        - total_generations
        - unique_generations
        - last_run
      scan_interval: 900
      command_timeout: 30

script:
  # ---- store the passphrase, then forget it ---------------------------------
  config_export_save_passphrase:
    alias: Config export save passphrase
    icon: mdi:key-variant
    mode: single
    sequence:
      - variables:
          # Take whichever box the user was actually typing in; fall back to
          # the other if that one is empty.
          typed: >-
            {% set shown = states('input_text.export_passphrase_plain') %}
            {% set hidden = states('input_text.export_passphrase') %}
            {% set shown = '' if shown in ['unknown', 'unavailable'] else shown %}
            {% set hidden = '' if hidden in ['unknown', 'unavailable'] else hidden %}
            {% if is_state('input_boolean.export_show_passphrase', 'on') %}
            {{ shown if shown else hidden }}
            {%- else %}
            {{ hidden if hidden else shown }}
            {%- endif %}
          phrase: "{{ typed | trim }}"
      - condition: template
        value_template: "{{ phrase | length > 0 }}"
      - action: shell_command.config_export_set_passphrase
        data:
          phrase: "{{ phrase }}"
      # Both boxes cleared immediately, so the passphrase does not sit in an
      # entity, the recorder database, or the next export of .storage.
      - action: input_text.set_value
        target:
          entity_id: input_text.export_passphrase
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.export_passphrase_plain
        data:
          value: ""
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.config_export_passphrase
      - action: persistent_notification.create
        data:
          notification_id: config_export_passphrase
          title: Backup passphrase saved
          message: >-
            Stored in /share/ha_config_backup/.passphrase, which the export
            excludes from its own output. **Write it down somewhere else** — if
            that file is lost, encrypted archives cannot be opened.

  # ---- remove the stored passphrase -----------------------------------------
  config_export_clear_passphrase:
    alias: Config export clear passphrase
    icon: mdi:key-remove
    mode: single
    sequence:
      - action: shell_command.config_export_clear_passphrase
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.config_export_passphrase
      - action: persistent_notification.create
        data:
          notification_id: config_export_passphrase
          title: Backup passphrase removed
          message: >-
            Encrypted exports will now fail with a message naming the missing
            file, and existing encrypted archives cannot be opened until a
            passphrase is set again. If it was the only copy, those archives
            are unreadable for good.

  # ---- clear old rollbacks and sidecars -------------------------------------
  config_export_cleanup:
    alias: Config export cleanup
    icon: mdi:broom
    mode: single
    sequence:
      - action: shell_command.config_export_cleanup
        response_variable: cleaned
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.config_export_cleanup
      - variables:
          result: "{{ (cleaned.stdout or '{}') | from_json }}"
      - action: persistent_notification.create
        data:
          notification_id: config_export_cleanup
          title: Cleanup complete
          message: >-
            Removed {{ result.removed | default(0) }} item(s),
            freeing {{ result.freed_mb | default(0) }} MB.
            {% if result.errors %}

            Errors: {{ result.errors | join(', ') }}{% endif %}

  config_export_run_now:
    alias: Config export run now
    icon: mdi:play-circle-outline
    mode: single
    sequence:
      - action: shell_command.config_yaml_export
        response_variable: export
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.config_export_status
      - if:
          - condition: template
            value_template: "{{ export.returncode | int(1) != 0 }}"
        then:
          # persistent_notification first: it always exists, so a wrong
          # notify service name can no longer swallow the failure.
          - action: persistent_notification.create
            data:
              notification_id: config_export_failed
              title: Config export failed
              message: >-
                Exit code {{ export.returncode }}.

                {{ (export.stderr or export.stdout or 'No output.')
                   | truncate(600) }}
          # OPTIONAL push to your phone. Replace this with your own notify
          # service, or delete the whole action — the persistent notification
          # above always fires, so failures are reported either way.
          - action: notify.mobile_app_YOUR_PHONE
            continue_on_error: true
            data:
              title: Config export failed
              message: >-
                Exit {{ export.returncode }}. {{ (export.stderr or export.stdout)
                | replace('\n', ' ') | truncate(180) }}
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: config_export_failed
          # ---------------------------------------------------------------
          # Success notification — OFF by default. It fires on every run,
          # including the nightly one, so most people will not want a daily
          # "it worked" message. Uncomment the block below to switch it on.
          # It reuses a single notification_id, so it replaces itself rather
          # than stacking up.
          #
          # - action: persistent_notification.create
          #   data:
          #     notification_id: config_export_ok
          #     title: Config export complete
          #     message: >-
          #       {{ state_attr('sensor.config_export_status', 'last_run').files }} files,
          #       {{ state_attr('sensor.config_export_status', 'last_run').converted }}
          #       converted to YAML,
          #       {{ state_attr('sensor.config_export_status', 'total_mb') }} MB on disk.
          # ---------------------------------------------------------------

automation:
  # Tells you once when there is something to clear, rather than silently
  # deleting or silently accumulating. Cleared automatically when nothing is
  # eligible, so it does not linger after you act on it.
  - id: config_export_cleanup_available
    alias: Config export cleanup available
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.config_export_cleanup
        above: 0
        id: something
      - trigger: numeric_state
        entity_id: sensor.config_export_cleanup
        below: 1
        id: nothing
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: something
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: config_export_cleanup_available
                  title: Old backup copies can be cleared
                  message: >-
                    {{ states('sensor.config_export_cleanup') }} item(s) —
                    {{ state_attr('sensor.config_export_cleanup', 'eligible_mb') }} MB —
                    sit outside the
                    {{ state_attr('sensor.config_export_cleanup', 'keep_recent') }}
                    most recent and can be cleared under **Cleanup** on the
                    Configuration Export card.

                    Ignoring this is fine: automatic pruning removes anything both
                    that old and older than
                    {{ state_attr('sensor.config_export_cleanup', 'keep_days') }} days
                    without being asked. Clearing manually just reclaims the space
                    sooner.
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: config_export_cleanup_available

  - id: config_export_daily
    alias: Config export daily
    description: >-
      Runs the YAML/JSON configuration export at the time set on the dashboard
      card, keeping 7 daily / 4 weekly / 12 monthly / 5 yearly generations.
      A restart only triggers an export if the last one is over a day old.
    mode: single
    triggers:
      - trigger: time
        at: input_datetime.config_export_time
        id: scheduled
      - trigger: homeassistant
        event: start
        id: startup
    actions:
      - choose:
          # Restart path: settle, refresh the sensor, THEN judge staleness.
          # The staleness check has to come after the refresh — at startup the
          # command_line sensor has not polled yet and reads as unknown, which
          # would look like "never run" and export on every restart.
          - conditions:
              - condition: trigger
                id: startup
            sequence:
              - delay: "00:00:30"
              - action: homeassistant.update_entity
                target:
                  entity_id: sensor.config_export_status
              - if:
                  - condition: template
                    value_template: >-
                      {% set lr = state_attr('sensor.config_export_status', 'last_run') %}
                      {{ lr is not mapping or lr.timestamp is not defined
                         or (now() - (lr.timestamp | as_datetime | as_local)).total_seconds()
                            > 86400 }}
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.config_export_run_now
        # Scheduled runs and manual "Run actions" go straight through.
        default:
          - action: script.turn_on
            target:
              entity_id: script.config_export_run_now
