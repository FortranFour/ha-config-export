        # --- queue actions -----------------------------------------------------------
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              primary: Add to queue
              secondary: Ticked files
              icon: mdi:playlist-plus
              icon_color: blue
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.restore_add_selected
            - type: custom:mushroom-template-card
              primary: Clear queue
              secondary: >-
                {%- set q = state_attr('sensor.config_restore_browser', 'queue_count') | int(0) -%}
                {{ q ~ ' queued' }}
              icon: mdi:playlist-remove
              icon_color: >-
                {{ 'orange' if (state_attr('sensor.config_restore_browser', 'queue_count') | int(0)) > 0
                   else 'grey' }}
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.restore_clear_queue


  # --- queue contents + the restore controls ----------------------------------
  # --- "Restore" fold -------------------------------------------------------------
  # Same construction as "Specify files" rather than a fold-entity-row: identical
  # markup means identical type, inset and vertical rhythm, and the chevron is
  # the same CSS one instead of an mdi glyph on its own line.
  # Reuses input_boolean.restore_show_list, which the earlier layout freed up.
  - type: entities
    show_header_toggle: false
    card_mod:
      style: |
        ha-card {
          box-shadow: none;
          background: transparent;
          padding: 0 !important;
        }
        #states {
          padding: 0 16px 4px 16px !important;
          border-top: 1px solid var(--divider-color);
          padding-top: 12px !important;
        }
    entities:
      - entity: input_boolean.restore_show_list
        name: Restore
        tap_action:
          action: toggle
        card_mod:
          style:
            hui-generic-entity-row$: |
              state-badge {
                display: none !important;
                width: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
              }
              :host {
                padding-left: 0 !important;
                margin-left: 0 !important;
              }
              .info {
                position: relative !important;
                padding-right: 26px !important;
                margin-left: 0 !important;
                margin-inline-start: 0 !important;
                padding-left: 0 !important;
                text-indent: 0 !important;
                font-size: 15px !important;
                font-weight: 500 !important;
                line-height: 20px !important;
                letter-spacing: normal !important;
                color: var(--primary-text-color) !important;
              }
              /* The chevron lives on .info, not on :host::after: WebKit (the iOS app)
                 does not give a host pseudo-element a positioning context, so an
                 absolutely positioned :host::after lands at the card's left edge. */
              .info::after {
                content: "";
                position: absolute;
                right: 12px;
                top: 50%;
                width: 9px;
                height: 9px;
                margin-top: -6px;
                border-right: 2.8px solid var(--primary-text-color);
                border-bottom: 2.8px solid var(--primary-text-color);
                transform: rotate({{ '-135deg' if is_state('input_boolean.restore_show_list', 'on') else '45deg' }}) translate(-2px, -2px);
                transition: transform 180ms ease-in-out;
                pointer-events: none;
              }
            .: |
              :host {
                position: relative;
              }
              ha-entity-toggle,
              ha-switch,
              ha-toggle {
                display: none !important;
              }

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.restore_show_list
        state: "on"
    card:
      type: entities
      show_header_toggle: false
      card_mod:
        style: |
          ha-card {
            box-shadow: none;
            background: transparent;
            padding: 0 !important;
          }
          #states {
            padding: 0 16px 4px 16px !important;
          }
      entities:
        # No last-changed here: it is not on a timer, so an age tells you
        # nothing and reads like a countdown next to the row below that is one.
        - entity: input_boolean.restore_allow_storage
          name: Allow .storage restores
          icon: mdi:database-lock
          state_color: true
        # A timer row: its state text ticks down every second, which a
        # template cannot do. card_mod restyles that text into a pill so it
        # reads as a control rather than a label — red while armed, grey and
        # showing "Idle" when not.
        - entity: timer.restore_armed
          name: Arm restore
          icon: mdi:shield-alert
          state_color: true
          tap_action:
            action: perform-action
            perform_action: script.turn_on
            target:
              entity_id: script.restore_arm_toggle
          card_mod:
            style: |
              .text-content {
                display: inline-block;
                min-width: 76px;
                text-align: center;
                padding: 4px 14px;
                border-radius: 999px;
                font-size: 13px;
                line-height: 18px;
                font-variant-numeric: tabular-nums;
                text-transform: capitalize;
                transition: background-color 180ms ease-in-out;
                {% if is_state('timer.restore_armed', 'active') %}
                background: var(--error-color);
                color: var(--text-primary-color);
                border: 1px solid var(--error-color);
                font-weight: 500;
                {% else %}
                background: var(--divider-color);
                color: var(--secondary-text-color);
                border: 1px solid var(--divider-color);
                {% endif %}
              }
              :host {
                cursor: pointer;
              }

  # --- restore button: appears once armed --------------------------------------
  - type: conditional
    conditions:
      - condition: state
        entity: timer.restore_armed
        state: active
    card:
      type: custom:mushroom-template-card
      primary: Restore queued files
      secondary: >-
        {%- set q = state_attr('sensor.config_restore_browser', 'queue_count') | int(0) -%}
        {{ 'Overwrites ' ~ q ~ ' file' ~ ('' if q == 1 else 's') ~ ' — rollback saved' }}
      icon: mdi:file-restore
      icon_color: red
      tap_action:
        action: perform-action
        perform_action: script.turn_on
        target:
          entity_id: script.restore_execute


  # --- what is queued ----------------------------------------------------------
  - type: markdown
    card_mod:
      style:
        .: |
          ha-card {
            box-shadow: none;
            background: transparent;
            padding: 0 !important;
          }
          ha-markdown {
            padding: 0 16px 12px 16px !important;
          }
        ha-markdown$: |
          details {
            border-top: 1px solid var(--divider-color);
            padding: 12px 0 0 0;
          }
          summary {
            cursor: pointer;
            margin-left: 0;
            padding-left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 500;
            color: var(--primary-text-color);
            padding: 4px 0;
            list-style: none;
          }
          summary::-webkit-details-marker {
            display: none;
          }
          summary::marker {
            content: "";
          }
          summary::after {
            content: "";
            width: 9px;
            height: 9px;
            margin-right: 12px;
            border-right: 2.8px solid var(--primary-text-color);
            border-bottom: 2.8px solid var(--primary-text-color);
            transform: rotate(45deg) translate(-2px, -2px);
            transition: transform 180ms ease-in-out;
          }
          details[open] summary::after {
            transform: rotate(-135deg) translate(-2px, -2px);
          }
          ul {
            margin: 8px 0 0 0;
            padding-left: 18px;
            font-size: 12px;
          }
          li {
            margin-bottom: 3px;
            word-break: break-all;
          }
          details > div {
            padding-top: 14px;
            font-size: 12px;
            opacity: 0.8;
          }
    content: |
      {% set s = 'sensor.config_restore_browser' %}
      {% set q = state_attr(s, 'queue') or [] %}
      <details>
      <summary>Queued files ({{ state_attr(s, 'queue_count') | int(0) }})</summary>
      {% if q | count > 0 %}<ul>
      {% for f in q %}<li>{{ f }}</li>
      {% endfor %}</ul>
      {% else %}<div>Nothing queued. Tick files above and press Add to queue.</div>
      {% endif %}
      <div>Source: {{ state_attr(s, 'generation_label') or 'none selected' }} · replaced files are copied to <code>_restore_rollback</code> first</div>
      </details>
