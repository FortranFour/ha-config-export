# =============================================================================
#  Configuration Restore — selective file restore card
#
#  Requires (all HACS): stack-in-card, mushroom, button-card, card-mod.
#  Backed by config_restore.yaml and ha_config_restore.py.
#
#  HOW IT WORKS
#    1. Pick a generation and a filter; the file list below re-renders.
#    2. Tick files, press "Add to queue". Change page or filter and tick more —
#       the queue persists across pages and even across generations.
#    3. Open "Restore", arm it, press the button.
#
#  Home Assistant has no dynamic checkbox list, so this uses 12 fixed
#  checkbox entities whose labels come from the sensor, plus paging. Files
#  marked in red with a warning triangle are registries or auth data that can
#  lock you out — those additionally need the .storage switch.
# =============================================================================

type: custom:stack-in-card
mode: vertical
cards:
  - type: custom:mushroom-title-card
    title: Configuration Restore
    subtitle: >-
      {%- set s = 'sensor.config_restore_browser' -%}
      {%- set q = state_attr(s, 'queue_count') | int(0) -%}
      {%- set ch = state_attr(s, 'changed_count') | int(0) -%}
      {%- set nw = state_attr(s, 'new_count') | int(0) -%}
      {%- set grp = state_attr(s, 'in_group') | int(0) -%}
      {%- set found = state_attr(s, 'matched') | int(0) -%}
      {%- set term = state_attr(s, 'search') -%}
      {{ (q ~ ' queued · ') if q > 0 else '' }}
      {{ (ch + nw) ~ ' of ' ~ grp ~ ' differ from live' }}
      {{ (' · ' ~ found ~ ' match “' ~ term ~ '”') if term else '' }}
    card_mod:
      style: |
        :host, .header {
          padding: 12px 16px 4px 16px !important;
        }
        .title {
          font-family: var(--ha-card-header-font-family, inherit) !important;
          font-size: var(--ha-card-header-font-size, 24px) !important;
          font-weight: 400 !important;
          letter-spacing: -0.012em !important;
          line-height: 32px !important;
          color: var(--ha-card-header-color, var(--primary-text-color)) !important;
          margin: 0 !important;
        }
        .subtitle {
          font-size: 14px !important;
          font-weight: 400 !important;
          line-height: 20px !important;
          color: var(--secondary-text-color) !important;
          margin: 2px 0 0 0 !important;
        }

  # --- source and filter -------------------------------------------------------
  - type: entities
    show_header_toggle: false
    card_mod:
      style: |
        ha-card {
          box-shadow: none;
          background: transparent;
          padding: 0 !important;
        }
        #states {
          padding: 0 16px 4px 16px !important;
        }
    entities:
      - entity: input_select.restore_generation
        name: Restore from
        icon: mdi:history
      - entity: input_select.restore_group
        name: File type
        icon: mdi:filter-variant
      - entity: input_boolean.restore_only_changed
        name: Only files that differ
        icon: mdi:file-compare
        state_color: true

  # --- "Specify files" fold ------------------------------------------------------
  # A standard toggle row with its switch hidden and a chevron drawn in CSS, so
  # the header matches the Restore and Queued files folds. HA renders the row,
  # so its type and inset need no hand-matching.
  - type: entities
    show_header_toggle: false
    card_mod:
      style: |
        ha-card {
          box-shadow: none;
          background: transparent;
          padding: 0 !important;
        }
        #states {
          padding: 0 16px 4px 16px !important;
          border-top: 1px solid var(--divider-color);
          padding-top: 12px !important;
        }
    entities:
      - entity: input_boolean.restore_show_path
        name: Specify files
        # Without this the row opens the more-info dialog, since hiding the
        # switch leaves it with nothing else to do on tap.
        tap_action:
          action: toggle
        card_mod:
          style:
            # The icon badge and the name live inside hui-generic-entity-row's
            # own shadow root, so they need the nested selector. Hiding the
            # badge and zeroing .info's left margin puts the label flush at the
            # same 16px inset as the Restore and Queued files headers.
            hui-generic-entity-row$: |
              state-badge {
                display: none !important;
                width: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
              }
              :host {
                padding-left: 0 !important;
                margin-left: 0 !important;
              }
              .info {
                position: relative !important;
                padding-right: 26px !important;
                margin-left: 0 !important;
                margin-inline-start: 0 !important;
                padding-left: 0 !important;
                text-indent: 0 !important;
                font-size: 15px !important;
                font-weight: 500 !important;
                line-height: 20px !important;
                letter-spacing: normal !important;
                color: var(--primary-text-color) !important;
              }
              /* The chevron lives on .info, not on :host::after: WebKit (the iOS app)
                 does not give a host pseudo-element a positioning context, so an
                 absolutely positioned :host::after lands at the card's left edge. */
              .info::after {
                content: "";
                position: absolute;
                right: 12px;
                top: 50%;
                width: 9px;
                height: 9px;
                margin-top: -6px;
                border-right: 2.8px solid var(--primary-text-color);
                border-bottom: 2.8px solid var(--primary-text-color);
                transform: rotate({{ '-135deg' if is_state('input_boolean.restore_show_path', 'on') else '45deg' }}) translate(-2px, -2px);
                transition: transform 180ms ease-in-out;
                pointer-events: none;
              }
            .: |
              :host {
                position: relative;
              }
              ha-entity-toggle,
              ha-switch,
              ha-toggle {
                display: none !important;
              }

  - type: conditional
    conditions:
      - condition: state
        entity: input_boolean.restore_show_path
        state: "on"
    card:
      type: vertical-stack
      cards:
        # --- sub-section: by path ----------------------------------------------
        # Both sub-headings are native section rows. The first hides its rule
        # (the fold header above already provides one); the second keeps it, and
        # that is the light line separating the two methods.
        - type: entities
          show_header_toggle: false
          card_mod:
            style: |
              ha-card {
                box-shadow: none;
                background: transparent;
                padding: 0 !important;
              }
              #states {
                padding: 0 16px 4px 16px !important;
              }
          entities:
            - type: section
              label: Find by path
              card_mod:
                style: |
                  .label {
                    margin-left: 0 !important;
                    margin-inline-start: 0 !important;
                    padding-left: 0 !important;
                  }
                  .divider {
                    display: none !important;
                  }
            - entity: input_text.restore_path
              name: Path or pattern
              icon: mdi:file-search-outline
            - type: call-service
              name: Queue this path
              icon: mdi:file-plus-outline
              action_name: QUEUE
              service: script.turn_on
              service_data:
                entity_id: script.restore_add_path


        # --- sub-section: by list ----------------------------------------------
        - type: entities
          show_header_toggle: false
          card_mod:
            style: |
              ha-card {
                box-shadow: none;
                background: transparent;
                padding: 0 !important;
              }
              #states {
                padding: 0 16px 4px 16px !important;
              }
          entities:
            - type: section
              label: Find by list
              card_mod:
                style: |
                  .label {
                    margin-left: 0 !important;
                    margin-inline-start: 0 !important;
                    padding-left: 0 !important;
                  }
                  .divider {
                    margin-left: 0 !important;
                    margin-right: 0 !important;
                    margin-inline-start: 0 !important;
                    margin-inline-end: 0 !important;
                  }

        # --- search within the current file type -----------------------------
        - type: entities
          show_header_toggle: false
          card_mod:
            style: |
              ha-card {
                box-shadow: none;
                background: transparent;
                padding: 0 !important;
              }
              #states {
                padding: 0 16px 0 16px !important;
              }
          entities:
            - entity: input_text.restore_search
              name: Search
              icon: mdi:magnify
            - type: call-service
              name: |
                Clear search
              icon: mdi:close-circle-outline
              action_name: CLEAR
              service: script.turn_on
              service_data:
                entity_id: script.restore_clear_search

        # --- refresh + paging ---------------------------------------------------------
        - type: grid
          columns: 4
          square: false
          cards:
            - type: custom:button-card
              icon: mdi:refresh
              show_name: false
              tap_action:
                action: perform-action
                perform_action: script.turn_on
                target:
                  entity_id: script.restore_refresh
              hold_action:
                action: none
              styles:
                card:
                  - padding: 4px
                  - border: none
                  - background: none
                icon:
                  - width: 20px
                  - color: |
                      [[[
                        const g = states['sensor.config_restore_browser'].attributes.generations;
                        return (!g || g.length === 0) ? 'var(--error-color)'
                          : 'var(--secondary-text-color)';
                      ]]]
            - type: custom:button-card
              icon: mdi:chevron-left
              show_name: false
              tap_action:
                action: perform-action
                perform_action: input_number.decrement
                target:
                  entity_id: input_number.restore_page
              styles:
                card:
                  - padding: 4px
                  - border: none
                  - background: none
                icon:
                  - width: 22px
                  - color: |
                      [[[
                        return (states['sensor.config_restore_browser'].attributes.page || 1) > 1
                          ? 'var(--primary-text-color)' : 'var(--disabled-text-color)';
                      ]]]
            - type: custom:button-card
              show_icon: false
              show_name: true
              name: |
                [[[
                  const a = states['sensor.config_restore_browser'].attributes;
                  return `Page ${a.page || 1} / ${a.pages || 1}`;
                ]]]
              tap_action:
                action: none
              styles:
                card:
                  - padding: 4px
                  - border: none
                  - background: none
                name:
                  - font-size: 13px
                  - color: var(--secondary-text-color)
            - type: custom:button-card
              icon: mdi:chevron-right
              show_name: false
              tap_action:
                action: perform-action
                perform_action: input_number.increment
                target:
                  entity_id: input_number.restore_page
              styles:
                card:
                  - padding: 4px
                  - border: none
                  - background: none
                icon:
                  - width: 22px
                  - color: |
                      [[[
                        const a = states['sensor.config_restore_browser'].attributes;
                        return (a.page || 1) < (a.pages || 1)
                          ? 'var(--primary-text-color)' : 'var(--disabled-text-color)';
                      ]]]

        # --- sort headers, spreadsheet style ---------------------------------
        - type: grid
          columns: 2
          square: false
          cards:
            - type: custom:button-card
              show_icon: false
              show_name: true
              name: |
                [[[
                  const sel = states['input_select.restore_sort'].state;
                  const desc = states['input_boolean.restore_sort_desc'].state === 'on';
                  const active = sel === 'Name';
                  return active ? `Name ${desc ? '\u2193' : '\u2191'}` : 'Name';
                ]]]
              tap_action:
                action: perform-action
                perform_action: script.restore_sort_by
                data:
                  field: Name
              styles:
                card:
                  - padding: 2px 8px 6px 8px
                  - border: none
                  - background: none
                name:
                  - font-size: 12px
                  - justify-self: |
                      [[[ return 'Name' === 'Size' ? 'end' : 'start'; ]]]
                  - color: |
                      [[[
                        return states['input_select.restore_sort'].state === 'Name'
                          ? 'var(--primary-text-color)' : 'var(--secondary-text-color)';
                      ]]]
                  - font-weight: |
                      [[[
                        return states['input_select.restore_sort'].state === 'Name'
                          ? '500' : '400';
                      ]]]
            - type: custom:button-card
              show_icon: false
              show_name: true
              name: |
                [[[
                  const sel = states['input_select.restore_sort'].state;
                  const desc = states['input_boolean.restore_sort_desc'].state === 'on';
                  const active = sel === 'Size';
                  return active ? `Size ${desc ? '\u2193' : '\u2191'}` : 'Size';
                ]]]
              tap_action:
                action: perform-action
                perform_action: script.restore_sort_by
                data:
                  field: Size
              styles:
                card:
                  - padding: 2px 8px 6px 8px
                  - border: none
                  - background: none
                name:
                  - font-size: 12px
                  - justify-self: |
                      [[[ return 'Size' === 'Size' ? 'end' : 'start'; ]]]
                  - color: |
                      [[[
                        return states['input_select.restore_sort'].state === 'Size'
                          ? 'var(--primary-text-color)' : 'var(--secondary-text-color)';
                      ]]]
                  - font-weight: |
                      [[[
                        return states['input_select.restore_sort'].state === 'Size'
                          ? '500' : '400';
                      ]]]

        # --- the checkbox list -------------------------------------------------------
        - type: grid
          columns: 1
          square: false
          cards:
            - type: custom:button-card
              entity: input_boolean.restore_slot_01
              show_name: true
              show_icon: true
              show_state: false
              name: |
                [[[
                  const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                  if (!f) return '';
                  return f.risky ? f.label + '  \u26a0' : f.label;
                ]]]
              icon: |
                [[[
                  const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                  if (f && f.status === 'identical') return 'mdi:equal';
                  if (entity.state === 'on') return 'mdi:checkbox-marked';
                  return f && f.status === 'new'
                    ? 'mdi:plus-box-outline'
                    : 'mdi:checkbox-blank-outline';
                ]]]
              show_label: true
              label: |
                [[[
                  const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                  return f ? (f.size || '') : '';
                ]]]
              tap_action:
                action: toggle
              styles:
                card:
                  - padding: 6px 8px
                  - border: none
                  - background: none
                  - opacity: |
                      [[[
                        const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                        return f && f.status === 'identical' ? '0.45' : '1';
                      ]]]
                  - pointer-events: |
                      [[[
                        const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                        return f && f.status === 'identical' ? 'none' : 'auto';
                      ]]]
                  - display: |
                      [[[
                        return (states['sensor.config_restore_browser'].attributes.files || [])[0]
                          ? 'block' : 'none';
                      ]]]
                grid:
                  - grid-template-areas: '"i n l"'
                  - grid-template-columns: 30px 1fr auto
                  - align-items: center
                icon:
                  - width: 20px
                  - color: |
                      [[[
                        const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                        if (entity.state === 'on') return f && f.risky
                          ? 'var(--error-color)' : 'var(--primary-color)';
                        return 'var(--secondary-text-color)';
                      ]]]
                label:
                  - justify-self: end
                  - text-align: right
                  - font-size: 11px
                  - white-space: nowrap
                  - padding-left: 8px
                  - color: var(--secondary-text-color)
                name:
                  - justify-self: start
                  - text-align: left
                  - font-size: 12px
                  - white-space: normal
                  - word-break: break-all
                  - line-height: 1.25
                  - color: |
                      [[[
                        const f = (states['sensor.config_restore_browser'].attributes.files || [])[0];
                        return f && f.risky ? 'var(--error-color)'
                          : 'var(--primary-text-color)';
                      ]]]
